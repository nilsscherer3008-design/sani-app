<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sani-Quiz | Tägliches Training</title>
<style>
  :root {
    --drk-red: #cc0000;
    --drk-red-dark: #a00000;
    --drk-red-light: #ffecec;
    --grey-900: #262626;
    --grey-700: #545454;
    --grey-400: #9c9c9c;
    --grey-200: #e2e2e2;
    --grey-100: #f4f4f4;
    --white: #ffffff;
    --green: #1e7d34;
    --green-light: #e8f7ec;
    --red: #b3261e;
    --red-light: #fdecea;
    --radius: 14px;
    --shadow: 0 8px 24px rgba(0,0,0,0.08);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: var(--grey-100);
    color: var(--grey-900);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 16px 60px;
  }

  .app {
    width: 100%;
    max-width: 560px;
  }

  /* Header / Signature element: heartbeat line */
  header {
    background: var(--white);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px 24px 18px;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
    border-top: 6px solid var(--drk-red);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .cross {
    width: 34px;
    height: 34px;
    flex-shrink: 0;
    position: relative;
  }
  .cross::before, .cross::after {
    content: "";
    position: absolute;
    background: var(--drk-red);
  }
  .cross::before { top: 0; left: 40%; width: 20%; height: 100%; border-radius: 3px; }
  .cross::after { left: 0; top: 40%; height: 20%; width: 100%; border-radius: 3px; }

  header h1 {
    margin: 0;
    font-size: 1.3rem;
    letter-spacing: -0.01em;
  }
  header p.subtitle {
    margin: 2px 0 0;
    font-size: 0.85rem;
    color: var(--grey-700);
  }

  .heartbeat {
    margin-top: 14px;
    width: 100%;
    height: 34px;
    stroke: var(--drk-red);
  }
  .heartbeat path {
    fill: none;
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 300;
    stroke-dashoffset: 300;
    animation: draw 2.4s ease-in-out infinite;
  }
  @keyframes draw {
    0% { stroke-dashoffset: 300; }
    45% { stroke-dashoffset: 0; }
    100% { stroke-dashoffset: 0; opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .heartbeat path { animation: none; stroke-dashoffset: 0; }
  }

  .progress-wrap {
    background: var(--white);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 14px 20px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .progress-track {
    flex: 1;
    height: 8px;
    background: var(--grey-200);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--drk-red);
    border-radius: 99px;
    transition: width 0.35s ease;
  }
  .progress-label {
    font-size: 0.82rem;
    color: var(--grey-700);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .card {
    background: var(--white);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 26px 24px 24px;
  }

  .category-tag {
    display: inline-block;
    background: var(--drk-red-light);
    color: var(--drk-red-dark);
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 4px 10px;
    border-radius: 99px;
    margin-bottom: 12px;
  }

  .question {
    font-size: 1.12rem;
    font-weight: 600;
    line-height: 1.45;
    margin: 0 0 20px;
    color: var(--grey-900);
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .option {
    text-align: left;
    padding: 13px 16px;
    border: 1.5px solid var(--grey-200);
    background: var(--white);
    border-radius: 10px;
    font-size: 0.98rem;
    color: var(--grey-900);
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
  }
  .option:hover:not(:disabled) {
    border-color: var(--drk-red);
    background: var(--drk-red-light);
  }
  .option:active:not(:disabled) { transform: scale(0.995); }
  .option:disabled { cursor: default; }

  .option.correct {
    border-color: var(--green);
    background: var(--green-light);
    color: var(--green);
    font-weight: 600;
  }
  .option.incorrect {
    border-color: var(--red);
    background: var(--red-light);
    color: var(--red);
    font-weight: 600;
  }
  .option.dim { opacity: 0.5; }

  .explanation {
    margin-top: 16px;
    padding: 14px 16px;
    border-radius: 10px;
    font-size: 0.9rem;
    line-height: 1.5;
    display: none;
  }
  .explanation.show { display: block; }
  .explanation.good { background: var(--green-light); color: #145226; }
  .explanation.bad { background: var(--red-light); color: #7a1a15; }
  .explanation strong { display: block; margin-bottom: 4px; }

  .next-btn {
    margin-top: 20px;
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: var(--drk-red);
    color: var(--white);
    font-size: 0.98rem;
    font-weight: 600;
    cursor: pointer;
    display: none;
    transition: background 0.15s ease;
  }
  .next-btn.show { display: block; }
  .next-btn:hover { background: var(--drk-red-dark); }
  .next-btn:focus-visible, .option:focus-visible {
    outline: 3px solid var(--drk-red-dark);
    outline-offset: 2px;
  }

  /* Result screen */
  .result {
    text-align: center;
    padding: 10px 4px 4px;
  }
  .result .score-circle {
    width: 128px;
    height: 128px;
    border-radius: 50%;
    border: 6px solid var(--drk-red);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    margin: 6px auto 20px;
  }
  .result .score-circle .num {
    font-size: 2rem;
    font-weight: 700;
    color: var(--grey-900);
    line-height: 1;
  }
  .result .score-circle .den {
    font-size: 0.85rem;
    color: var(--grey-700);
  }
  .result h2 { margin: 0 0 8px; font-size: 1.25rem; }
  .result p.msg { color: var(--grey-700); margin: 0 0 22px; font-size: 0.95rem; }

  .result-list {
    text-align: left;
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 22px;
  }
  .result-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 10px;
    background: var(--grey-100);
    font-size: 0.85rem;
  }
  .result-row .mark {
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    color: var(--white);
    font-weight: 700;
  }
  .result-row.ok .mark { background: var(--green); }
  .result-row.fail .mark { background: var(--red); }

  .footnote {
    text-align: center;
    font-size: 0.78rem;
    color: var(--grey-400);
    margin-top: 18px;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="cross"></div>
      <div>
        <h1>Sani-Quiz</h1>
        <p class="subtitle">Dein tägliches Training für den Schulsanitätsdienst &amp; die DRK-Ausbildung</p>
      </div>
    </div>
    <svg class="heartbeat" viewBox="0 0 300 34" preserveAspectRatio="none">
      <path d="M0,17 L70,17 L85,4 L100,30 L115,10 L125,17 L300,17"></path>
    </svg>
  </header>

  <div class="progress-wrap">
    <span class="progress-label" id="progressLabel">Frage 1 / 5</span>
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  </div>

  <div class="card" id="card"></div>

  <p class="footnote">Jeden Tag ein neues Zufallsquiz aus 5 Fragen &mdash; für Reanimation, Schock, Bewusstlosigkeit, Wundversorgung &amp; Eigenschutz.</p>
</div>

<script>
// ---------------------------------------------------------------
// Fragenpool: 15 typische Prüfungsfragen für Sanitätshelfer
// ---------------------------------------------------------------
const QUESTION_POOL = [
  {
    category: "Eigenschutz",
    question: "Was ist der allererste Schritt an JEDEM Einsatzort, bevor du dich einem Verletzten näherst?",
    options: [
      "Sofort die stabile Seitenlage durchführen",
      "Die Eigensicherung prüfen (Gefahren erkennen, z. B. Verkehr, Strom, Feuer)",
      "Den Rettungsdienst rufen",
      "Den Verletzten ansprechen"
    ],
    correct: 1,
    explanation: "Eigenschutz geht immer vor! Wenn du dich selbst gefährdest oder verletzt, kannst du niemandem mehr helfen. Erst die Lage sichern, dann handeln."
  },
  {
    category: "Reanimation",
    question: "In welchem Verhältnis werden bei der Erwachsenen-Reanimation Herzdruckmassage und Beatmung durchgeführt?",
    options: [
      "15 : 2",
      "30 : 2",
      "10 : 1",
      "5 : 1"
    ],
    correct: 1,
    explanation: "Die aktuelle Leitlinie sieht 30 Herzdruckmassagen und 2 Beatmungen im Wechsel vor, bis professionelle Hilfe eintrifft oder der Patient reagiert."
  },
  {
    category: "Reanimation",
    question: "Wie tief sollte der Brustkorb eines Erwachsenen bei der Herzdruckmassage eingedrückt werden?",
    options: [
      "ca. 1-2 cm",
      "ca. 5-6 cm",
      "ca. 10 cm",
      "so tief wie möglich"
    ],
    correct: 1,
    explanation: "Die Drucktiefe sollte 5 bis 6 cm betragen, mit einer Frequenz von 100-120 Kompressionen pro Minute, damit genug Blut zu Gehirn und Organen gepumpt wird."
  },
  {
    category: "Bewusstlosigkeit",
    question: "Eine Person atmet normal, reagiert aber nicht auf Ansprache und Schmerzreiz. Was machst du?",
    options: [
      "Herzdruckmassage beginnen",
      "Stabile Seitenlage und Notruf absetzen",
      "Nichts tun und abwarten",
      "Der Person etwas zu trinken geben"
    ],
    correct: 1,
    explanation: "Bei Bewusstlosigkeit mit normaler Atmung wird die stabile Seitenlage angewendet, damit die Atemwege frei bleiben. Eine Herzdruckmassage ist nur bei fehlender Atmung nötig."
  },
  {
    category: "Bewusstlosigkeit",
    question: "Warum bringt man eine bewusstlose, aber atmende Person in die stabile Seitenlage?",
    options: [
      "Damit sie bequemer liegt",
      "Damit Erbrochenes oder die Zunge die Atemwege nicht verlegen können",
      "Um den Kreislauf zu stabilisieren",
      "Damit sie schneller wieder aufwacht"
    ],
    correct: 1,
    explanation: "In Rückenlage kann die Zunge zurückfallen oder Erbrochenes in die Lunge laufen. Die Seitenlage hält die Atemwege frei und schützt vor Ersticken."
  },
  {
    category: "Schock",
    question: "Welches ist KEIN typisches Anzeichen eines Schocks?",
    options: [
      "Blasse, kaltschweißige Haut",
      "Schneller, schwacher Puls",
      "Unruhe und Angst",
      "Hohes Fieber über 39°C"
    ],
    correct: 3,
    explanation: "Fieber gehört nicht zu den klassischen Schockzeichen. Typisch sind Blässe, kalter Schweiß, schneller flacher Puls, Unruhe und Durst - Folge einer Unterversorgung von Organen mit Blut."
  },
  {
    category: "Schock",
    question: "Wie lagerst du einen Betroffenen im Schockzustand ohne Verletzung von Kopf, Wirbelsäule oder Beinen richtig?",
    options: [
      "Oberkörper hochlagern",
      "Beine hochlagern (Schocklage)",
      "Bauchlage",
      "Beine tief lagern, Oberkörper hoch"
    ],
    correct: 1,
    explanation: "Durch das Hochlagern der Beine fließt mehr Blut zu Herz, Gehirn und lebenswichtigen Organen zurück. Das gilt nicht bei Verletzungen von Kopf, Wirbelsäule, Bauch oder Beinen selbst."
  },
  {
    category: "Wundversorgung",
    question: "Wie versorgst du eine stark blutende Wunde am Arm zuerst?",
    options: [
      "Wunde großflächig desinfizieren",
      "Direkten Druck auf die Wunde ausüben (Druckverband)",
      "Den Arm schütteln, damit Schmutz herausfällt",
      "Abwarten, bis die Blutung von selbst aufhört"
    ],
    correct: 1,
    explanation: "Bei starken Blutungen zählt jede Sekunde: Direkter Druck (mit Verbandmaterial oder notfalls der Hand) stoppt die Blutung am schnellsten und verhindert einen Schock."
  },
  {
    category: "Wundversorgung",
    question: "Was gehört zu den ersten Schritten bei einem Druckverband?",
    options: [
      "Wundauflage auf die Wunde legen, dann mit einer Mullbinde fixieren",
      "Die Wunde ausspülen und offen lassen",
      "Ein Druckpolster direkt auf die unversorgte Wunde legen, ohne Wundauflage",
      "Die Blutung mit einem Tourniquet an jeder Extremität stoppen"
    ],
    correct: 0,
    explanation: "Zuerst kommt eine sterile Wundauflage auf die Wunde, darüber ein Druckpolster, das mit einer Mullbinde festgebunden wird - so entsteht gezielter Druck auf die Blutungsquelle."
  },
  {
    category: "Wundversorgung",
    question: "Wie sollte man einen in der Wunde steckenden Fremdkörper (z. B. ein Messer) behandeln?",
    options: [
      "Sofort herausziehen, damit die Wunde versorgt werden kann",
      "Den Fremdkörper stecken lassen und um ihn herum abpolstern",
      "Herausziehen und die Wunde fest verbinden",
      "Den Fremdkörper tiefer hineindrücken"
    ],
    correct: 1,
    explanation: "Ein Fremdkörper verschließt oft die Wunde teilweise und verhindert so eine stärkere Blutung. Wird er entfernt, kann es zu lebensgefährlichem Blutverlust kommen - deshalb wird nur um ihn herum abgepolstert."
  },
  {
    category: "Eigenschutz",
    question: "Warum sollten Einweghandschuhe bei der Wundversorgung getragen werden?",
    options: [
      "Damit die Hände sauber bleiben",
      "Zum Schutz vor Infektionen für Helfer und Verletzten",
      "Nur aus optischen Gründen",
      "Sie sind gesetzlich nicht vorgeschrieben und unnötig"
    ],
    correct: 1,
    explanation: "Handschuhe schützen beide Seiten: den Helfer vor Kontakt mit Blut und Krankheitserregern und den Verletzten vor zusätzlichen Keimen aus den Händen des Helfers."
  },
  {
    category: "Reanimation",
    question: "Was macht man zuerst, wenn man eine leblose Person auffindet?",
    options: [
      "Sofort mit der Herzdruckmassage beginnen",
      "Ansprechbarkeit prüfen und Hilfe rufen",
      "Die Person hochheben",
      "Wasser ins Gesicht spritzen"
    ],
    correct: 1,
    explanation: "Erst wird geprüft, ob die Person reagiert (ansprechen, sanft rütteln) und laut Hilfe gerufen bzw. der Notruf 112 abgesetzt, bevor mit der Reanimation begonnen wird."
  },
  {
    category: "Schock",
    question: "Welche Aussage über die psychische Betreuung eines Schockpatienten stimmt?",
    options: [
      "Der Betroffene sollte allein gelassen werden, um Ruhe zu haben",
      "Ruhig zureden, beruhigen und beim Betroffenen bleiben hilft, den Kreislauf zu stabilisieren",
      "Man sollte den Betroffenen ablenken, indem man laut Musik spielt",
      "Psychische Betreuung ist bei einem Schock nicht wichtig"
    ],
    correct: 1,
    explanation: "Angst und Stress verschlimmern einen Schock zusätzlich. Ruhiges Zureden und Anwesenheit wirken beruhigend und können den Kreislauf positiv beeinflussen."
  },
  {
    category: "Bewusstlosigkeit",
    question: "Wie prüfst du bei einer reglosen Person am schnellsten, ob eine normale Atmung vorhanden ist?",
    options: [
      "Puls am Handgelenk fühlen",
      "Atemwege freimachen (Kopf überstrecken) und maximal 10 Sekunden auf Atmung sehen, hören, fühlen",
      "Einen Spiegel vor die Augen halten",
      "Die Person ins Krankenhaus bringen und dort prüfen lassen"
    ],
    correct: 1,
    explanation: "Kopf überstrecken, um die Atemwege frei zu machen, dann für maximal 10 Sekunden sehen (Brustkorb), hören und fühlen, ob die Person normal atmet."
  },
  {
    category: "Wundversorgung",
    question: "Was ist bei einer Verbrennung als Erste-Hilfe-Maßnahme sinnvoll?",
    options: [
      "Sofort mit Eiswürfeln kühlen",
      "Mit handwarmem/kühlem Wasser kühlen (kein Eis) und die Wunde steril abdecken",
      "Butter oder Öl auf die Wunde geben",
      "Blasen sofort selbst aufstechen"
    ],
    correct: 1,
    explanation: "Kühlen mit kühlem (nicht eiskaltem) Wasser lindert den Schmerz und begrenzt die Gewebeschädigung. Eis kann zusätzliche Kälteschäden verursachen, Hausmittel wie Butter verschlimmern die Wunde."
  }
];

// ---------------------------------------------------------------
// Deterministischer "Zufall" pro Tag: gleicher Tag = gleiches Quiz
// ---------------------------------------------------------------
function seededRandom(seed) {
  let s = seed % 2147483647;
  if (s <= 0) s += 2147483646;
  return function() {
    s = (s * 16807) % 2147483647;
    return (s - 1) / 2147483646;
  };
}

function dateSeed() {
  const d = new Date();
  return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
}

function shuffle(array, rand) {
  const arr = array.slice();
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function buildDailyQuiz() {
  const rand = seededRandom(dateSeed());
  const chosen = shuffle(QUESTION_POOL, rand).slice(0, 5);
  // Antwortreihenfolge innerhalb jeder Frage ebenfalls mischen
  return chosen.map(q => {
    const optionIndices = shuffle(q.options.map((_, i) => i), rand);
    return {
      category: q.category,
      question: q.question,
      explanation: q.explanation,
      options: optionIndices.map(i => q.options[i]),
      correctIndex: optionIndices.indexOf(q.correct)
    };
  });
}

// ---------------------------------------------------------------
// App-Logik
// ---------------------------------------------------------------
const quiz = buildDailyQuiz();
let current = 0;
let score = 0;
const answerLog = [];

const card = document.getElementById("card");
const progressFill = document.getElementById("progressFill");
const progressLabel = document.getElementById("progressLabel");

function updateProgress() {
  const total = quiz.length;
  const step = Math.min(current + 1, total);
  progressLabel.textContent = `Frage ${step} / ${total}`;
  progressFill.style.width = `${(current / total) * 100}%`;
}

function renderQuestion() {
  updateProgress();
  const q = quiz[current];

  card.innerHTML = `
    <span class="category-tag">${q.category}</span>
    <p class="question">${q.question}</p>
    <div class="options" id="options"></div>
    <div class="explanation" id="explanation"></div>
    <button class="next-btn" id="nextBtn">Nächste Frage</button>
  `;

  const optionsEl = document.getElementById("options");
  q.options.forEach((optText, idx) => {
    const btn = document.createElement("button");
    btn.className = "option";
    btn.textContent = optText;
    btn.addEventListener("click", () => handleAnswer(idx, btn));
    optionsEl.appendChild(btn);
  });
}

function handleAnswer(selectedIdx, btnEl) {
  const q = quiz[current];
  const allBtns = document.querySelectorAll("#options .option");
  const isCorrect = selectedIdx === q.correctIndex;

  allBtns.forEach((b, idx) => {
    b.disabled = true;
    if (idx === q.correctIndex) {
      b.classList.add("correct");
    } else if (idx === selectedIdx) {
      b.classList.add("incorrect");
    } else {
      b.classList.add("dim");
    }
  });

  const explEl = document.getElementById("explanation");
  explEl.classList.add("show", isCorrect ? "good" : "bad");
  explEl.innerHTML = `<strong>${isCorrect ? "Richtig! ✅" : "Leider falsch ❌"}</strong>${q.explanation}`;

  if (isCorrect) score++;
  answerLog.push({ question: q.question, correct: isCorrect });

  document.getElementById("nextBtn").classList.add("show");
  document.getElementById("nextBtn").addEventListener("click", nextQuestion, { once: true });

  // Fokus für Tastaturnutzer auf den Weiter-Button setzen
  document.getElementById("nextBtn").focus();
}

function nextQuestion() {
  current++;
  if (current < quiz.length) {
    renderQuestion();
  } else {
    renderResult();
  }
}

function renderResult() {
  progressLabel.textContent = `Fertig!`;
  progressFill.style.width = `100%`;

  let msg;
  if (score === quiz.length) msg = "Perfekt! Du bist bestens vorbereitet. 🏅";
  else if (score >= quiz.length - 1) msg = "Sehr stark! Nur eine Kleinigkeit fehlt zur perfekten Runde.";
  else if (score >= 3) msg = "Guter Start - schau dir die Erklärungen nochmal an.";
  else msg = "Nicht schlimm, dafür ist das Quiz da. Morgen kommt eine neue Runde!";

  const rows = answerLog.map(a => `
    <div class="result-row ${a.correct ? "ok" : "fail"}">
      <span class="mark">${a.correct ? "✓" : "✗"}</span>
      <span>${a.question}</span>
    </div>
  `).join("");

  card.innerHTML = `
    <div class="result">
      <div class="score-circle">
        <span class="num">${score}/${quiz.length}</span>
        <span class="den">richtig</span>
      </div>
      <h2>${score} von ${quiz.length} richtig beantwortet!</h2>
      <p class="msg">${msg}</p>
      <div class="result-list">${rows}</div>
    </div>
  `;
}

renderQuestion();
</script>
</body>
</html>
